services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: ubc-ocpi-adaptor
    ports:
      - "${PORT:-6001}:6001"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=6001
      - DATABASE_URL=postgresql://postgres:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-ubc_ocpi_adaptor}?sslmode=disable
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - JWT_EXPIRES_IN=${JWT_EXPIRES_IN:-24h}
      - OCPI_VERSION=${OCPI_VERSION:-2.2.1}
      - OCPI_PARTY_ID=${OCPI_PARTY_ID:-}
      - OCPI_COUNTRY_CODE=${OCPI_COUNTRY_CODE:-IN}
      - CDS_BASE_URL=${CDS_BASE_URL:-}
      - CDS_API_KEY=${CDS_API_KEY:-}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - CLOUD_PROVIDER=${CLOUD_PROVIDER:-local}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - ubc-network

  postgres:
    image: postgres:16-alpine
    container_name: ubc-postgres
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-postgres}
      - POSTGRES_DB=${POSTGRES_DB:-ubc_ocpi_adaptor}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - ubc-network

  redis:
    image: redis:7-alpine
    container_name: ubc-redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - ubc-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  ubc-network:
    driver: bridge

